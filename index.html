<title>Chatwick</title>

<style>
  /* Шрифты лежат рядом с приложением — никаких запросов к сторонним сайтам */
  @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-cyrillic-400-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }

  @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-cyrillic-600-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Inter; font-weight: 700; font-display: swap; src: url(fonts/inter-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Inter; font-weight: 700; font-display: swap; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Lora; font-weight: 500; font-display: swap; src: url(fonts/lora-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Lora; font-weight: 500; font-display: swap; src: url(fonts/lora-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Lora; font-weight: 700; font-display: swap; src: url(fonts/lora-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Lora; font-weight: 700; font-display: swap; src: url(fonts/lora-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  :root {
    --bg: #1E1B2E; --card: #2A263D; --card2: #332E49; --line: #3A3550; --ink: #F3EEE3;
    --muted: #B9B1A2; --accent: #E9A23B; --good: #7FD1A8; --bad: #E26D5C; --night: #0F1A33; --moon: #8EA8FF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  body { min-height: 100vh; transition: background .4s; }
  body.is-night { background: var(--night); }
  main { padding: 16px 16px 104px; max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 14px; font-family: Lora, serif; font-size: 26px; font-weight: 700; }
  h2 { margin: 20px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
  p { margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { padding: 6px 10px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .card.hero { background: var(--accent); color: var(--bg); }
  .card.hero .sub { color: #3a2a12; }
  .title { font-family: Lora, serif; font-size: 18px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .meta { font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent); color: var(--bg); white-space: nowrap; }
  .tag.soon { background: transparent; border: 1px solid var(--muted); color: var(--ink); }
  .tag.done { background: transparent; border: 1px solid var(--good); color: var(--good); }
  .story { flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; }
  .btn { min-height: 48px; border: none; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; width: 100%; cursor: pointer; padding: 0 14px; }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.light { background: var(--ink); color: var(--bg); }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn:disabled { opacity: .45; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns .btn { flex: 1; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .head h1 { margin: 0 0 2px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: #7C6BB0; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex-shrink: 0; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--card); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { padding: 6px 10px; border-radius: 999px; background: var(--card); font-size: 12px; font-weight: 600; }
  .badge.off { opacity: .45; }
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { min-height: 40px; border: none; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--bg); font-weight: 700; }
  .rank { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .rank .n { width: 26px; font-weight: 700; color: var(--muted); }
  .rank .n.top { color: var(--accent); }
  .rank .who { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .pts { font-size: 14px; color: var(--muted); }
  .rank.me { background: var(--accent); color: var(--bg); border-radius: 10px; border: none; margin: 4px 0; }
  .rank.me .n, .rank.me .pts { color: var(--bg); font-weight: 700; }
  .empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }

  /* --- игра --- */
  .gamehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .gamehead .where { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gamehead .story-name { font-family: Lora, serif; font-size: 17px; font-weight: 700; }
  .rescue { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .rescue .cells { display: flex; gap: 4px; }
  .rescue .cell { width: 22px; height: 8px; border-radius: 3px; background: var(--line); }
  .rescue .cell.on { background: var(--good); }
  .role { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; font-weight: 600; border: none; color: var(--ink); width: 100%; font-family: inherit; cursor: pointer; text-align: left; }
  .role.traitor { background: #4A1F25; }
  .role .hint { font-size: 12px; color: var(--muted); font-weight: 500; }
  .chapter { background: var(--card); border-radius: 18px; overflow: hidden; margin-bottom: 12px; }
  .chapter .cover { background: linear-gradient(135deg, #2F2946, #1E1B2E); padding: 18px 16px 14px; border-bottom: 3px solid var(--accent); }
  .chapter .label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent); text-transform: uppercase; }
  .chapter .ctitle { font-family: Lora, serif; font-size: 26px; font-weight: 700; margin-top: 4px; }
  .chapter .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .chapter .intro { font-family: Lora, serif; font-size: 16px; line-height: 1.55; font-weight: 500; }
  .chapter .event { font-size: 14px; color: var(--muted); font-style: italic; border-left: 3px solid var(--line); padding-left: 10px; line-height: 1.45; }
  .question { font-size: 17px; font-weight: 700; }
  .opt { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--card2); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; overflow: hidden; margin-bottom: 8px; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: rgba(233, 162, 59, .14); transition: width .3s; }
  .opt .num { position: relative; width: 28px; height: 28px; border-radius: 8px; background: var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .opt .lbl { position: relative; flex: 1; }
  .opt .cnt { position: relative; font-weight: 700; color: var(--muted); }
  .opt.mine { border-color: var(--accent); }
  .opt.mine .num { background: var(--accent); color: var(--bg); }
  .opt:disabled { cursor: default; }
  .status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin: 4px 2px 10px; }
  .timer { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.45; margin-bottom: 12px; background: var(--card); }
  .banner.warn { background: #4A3A1A; }
  .night { text-align: center; padding: 26px 16px; background: linear-gradient(180deg, #16244A, #0F1A33); border-radius: 18px; margin-bottom: 12px; }
  .night .moon { font-size: 44px; }
  .night .ttl { font-family: Lora, serif; font-size: 28px; font-weight: 700; color: #DCE4FF; margin-top: 6px; }
  .night .sub { color: #A9B6DD; margin-top: 6px; }
  .night .decided { margin-top: 14px; display: inline-block; background: rgba(142, 168, 255, .15); color: #DCE4FF; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .nbtn { display: block; width: 100%; min-height: 56px; border-radius: 14px; border: none; font: inherit; font-weight: 700; font-size: 15px; margin-bottom: 8px; cursor: pointer; color: #fff; }
  .nbtn.sab { background: #B4433A; }
  .nbtn.frame { background: #6B3FA0; }
  .nbtn.sleep { background: #2A3A66; }
  .nbtn small { display: block; font-weight: 500; font-size: 12px; opacity: .8; }
  .result { border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .result.ok { background: #1F3A2E; }
  .result.sab { background: #4A1F25; }
  .result .rt { font-family: Lora, serif; font-size: 22px; font-weight: 700; }
  .result .rtext { font-family: Lora, serif; font-size: 15px; line-height: 1.5; margin-top: 8px; }
  .clue { margin-top: 12px; background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
  .clue b { color: var(--accent); }
  .counts { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .person { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--card); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; margin-bottom: 8px; }
  .person .pa { width: 36px; height: 36px; border-radius: 50%; background: #7C6BB0; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .person .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .cnt { font-weight: 700; color: var(--muted); }
  .person.mine { border-color: var(--bad); }
  .person:disabled { opacity: .5; cursor: default; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .final { border-radius: 18px; padding: 22px 16px; text-align: center; margin-bottom: 12px; }
  .final.caught { background: linear-gradient(180deg, #24523D, #1F3A2E); }
  .final.escape { background: linear-gradient(180deg, #1F4466, #18304A); }
  .final.stranded { background: linear-gradient(180deg, #5A2128, #3A1A20); }
  .final .big { font-size: 44px; }
  .final .ft { font-family: Lora, serif; font-size: 28px; font-weight: 700; margin-top: 6px; }
  .final .ftext { font-family: Lora, serif; font-size: 15px; line-height: 1.5; margin-top: 10px; opacity: .9; }
  .hist { font-size: 13px; line-height: 1.5; color: var(--muted); }
  .hist b { color: var(--ink); }
  .controls { display: flex; gap: 8px; margin-top: 6px; }
  .controls .btn { flex: 1; min-height: 44px; font-size: 14px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 96px; max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: none; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 4px calc(12px + env(safe-area-inset-bottom)); z-index: 10; }
  body.is-night nav { background: var(--night); }
  nav button { position: relative; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
  nav button[aria-current="page"] { color: var(--accent); }
  nav svg { width: 22px; height: 22px; }
  nav .dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: none; }
  nav .dot.on { display: block; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Разделы">
  <button type="button" data-tab="game">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20V17H6.5A2.5 2.5 0 0 0 4 19.5z"/></svg>Игра<span class="dot" id="gamedot"></span></button>
  <button type="button" data-tab="games">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Истории</button>
  <button type="button" data-tab="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Профиль</button>
  <button type="button" data-tab="ratings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg>Рейтинги</button>
</nav>
<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("#1E1B2E"); tg.setBackgroundColor("#1E1B2E"); } catch (e) {}
  }
  var hashParams = {};
  location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0) hashParams[kv.slice(0, i)] = kv.slice(i + 1);
  });

  // Режимы: live — приложение открыто из Telegram и обслуживается ботом (игра в реальном времени);
  // snapshot — бот прислал снимок данных в адресе после # (без игры); demo — открыто в браузере.
  var INIT = tg && tg.initData ? tg.initData : "";
  var MODE = INIT && /^\/app\/?$/.test(location.pathname) ? "live" : (hashParams.d ? "snapshot" : "demo");

  var TEASERS = {
    island: "Яхта разбилась о рифы. Кто-то из вас не хочет, чтобы вы выбрались с острова.",
    mansion: "Оглашение завещания в старом особняке. Мост смыло, телефон молчит, хозяин исчез."
  };

  var DEMO = {
    bot: "ChatwickBot",
    u: { n: "Аня", lvl: 7, pts: 1240, nx: 160, inlvl: 20, g: 23, w: 14, tg: 6, tw: 4, d: 9, me: 2 },
    s: [["island", "Остров", 1], ["mansion", "Особняк Вороновых", 0]],
    ct: { name: "Друзья с универа", rows: [["Shadow_Fox", 1842], ["Лёха_Танк", 1599], ["Аня", 1240], ["Котлета_Pro", 1187], ["Ирина_GG", 994]], me: 2 },
    pt: [["Shadow_Fox", 1842], ["Лёха_Танк", 1599], ["Аня", 1240], ["Котлета_Pro", 1187], ["Ирина_GG", 994]],
    ch: [["Офис маркетинга", 18420], ["11Б навсегда", 16905], ["Рыбалка и не только", 15340], ["Мамы 5 «А»", 14870], ["Друзья с универа", 14210]],
    mych: 4
  };
  var DEMO_PLAYERS = [
    { id: 1, name: "Аня", host: true, suspected: false }, { id: 2, name: "Лёха", host: false, suspected: false },
    { id: 3, name: "Ирина", host: false, suspected: false }, { id: 4, name: "Котлета", host: false, suspected: false }
  ];
  var DEMO_CHAPTER = {
    n: 1, total: 3, title: "Крушение",
    intro: "Шторм стих к рассвету. Вы лежите на мокром песке, вокруг — обломки яхты. В глубине острова поднимается тонкий дымок: здесь кто-то есть. А у самой воды торчит металлический ящик с замком.",
    event: "Где-то в джунглях кричит птица — слишком похоже на человеческий смех.",
    question: "Что делаете?", chosen: "Идти к дыму",
    options: [{ id: "smoke", label: "Идти к дыму", count: 2 }, { id: "box", label: "Вскрыть ящик", count: 1 }, { id: "wreck", label: "Обыскать обломки", count: 0 }]
  };
  function demoGame(phase) {
    var base = {
      chat: -1, chat_title: "Друзья с универа", story: { id: "island", title: "Остров", teaser: TEASERS.island },
      phase: phase, host: true, min_players: 2, players: DEMO_PLAYERS, timer: 94, progress: 1, goal: 3,
      me: { in: true, id: 1, role: "innocent", suspected: false, can_vote: true, vote: "smoke", accuse: null, night_done: false },

      })),
      el("h2", null, "Скоро"),
      soon("Кто это написал?", "Анонимные ответы — угадай автора.", "3–12 игроков · 15 минут"),
      soon("Суд чата", "Абсурдное дело, прокурор, присяжные и ИИ-судья.", "3–10 игроков · 20 минут"),
      soon("Слово дня", "Одно слово на весь чат. Кто угадает быстрее?", "Каждый день · 2 минуты"),
      addButton()
    ];
  }
  function stat(v, label) { return el("div", "stat", null, [el("b", null, String(v)), el("span", null, label)]); }
  function renderProfile() {
    var u = D.u || {}, name = u.n || "Игрок";
    var bar = el("div", "bar", null, [el("div")]);
    bar.firstChild.style.width = Math.max(0, Math.min(100, u.inlvl || 0)) + "%";
    return [
      el("div", "head", null, [el("div", "avatar", initial(name)), el("div", null, null, [el("h1", null, name), el("div", "sub", "Уровень " + (u.lvl || 1) + " · " + (u.pts || 0) + " баллов")])]),
      el("div", "card", null, [el("div", "row meta", null, [el("span", null, "До уровня " + ((u.lvl || 1) + 1)), el("span", null, (u.nx != null ? u.nx : 200) + " баллов")]), bar]),
      el("div", "stats", null, [stat(u.g || 0, "партий сыграно"), stat((u.tw || 0) + " из " + (u.tg || 0), "побед за предателя"), stat(u.d || 0, "раз нашёл(ла) предателя")]),
      el("h2", null, "Значки"),
      el("div", "badges", null, [
        el("span", (u.g || 0) >= 1 ? "badge" : "badge off", "Первая партия"), el("span", (u.d || 0) >= 3 ? "badge" : "badge off", "Детектив"),
        el("span", (u.tw || 0) >= 3 ? "badge" : "badge off", "Мастер обмана"), el("span", (u.g || 0) >= 10 ? "badge" : "badge off", "Душа компании"),
        el("span", (u.g || 0) >= 50 ? "badge" : "badge off", "Ветеран")
      ]),
      el("h2", null, "Мои истории"),
      el("div", null, null, (D.s || []).map(function (s) {
        return el("div", "card story", null, [el("div", null, null, [el("div", "title", s.t), el("div", "sub", s.p ? "пройдена" : "новая для вас")]), el("span", s.p ? "tag done" : "tag", s.p ? "✓" : "НОВАЯ")]);
      }))
    ];
  }
  function rankList(rows, meIndex) {
    if (!rows || !rows.length) return el("div", "empty", "Пока пусто — сыграйте первую партию!");
    return el("div", null, null, rows.map(function (r, i) {
      var me = i === meIndex, place = r[2] || i + 1;
      return el("div", me ? "rank me" : "rank", null, [el("span", place <= 3 ? "n top" : "n", String(place)), el("span", "who", r[0] + (me ? " (вы)" : "")), el("span", "pts", String(r[1]))]);
    }));
  }
  function renderRatings() {
    var tabs = [["chat", "Мой чат"], ["players", "Все игроки"], ["chats", "Битва чатов"]];
    if (!D.ct && ratingTab === "chat") ratingTab = "players";
    var bar = el("div", "tabs", null, tabs.map(function (t) {
      var b = button(null, t[1], function () { ratingTab = t[0]; haptic(); render(); });
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(ratingTab === t[0]));
      return b;
    }));
    bar.setAttribute("role", "tablist");
    var body;
    if (ratingTab === "chat") body = D.ct ? el("div", null, null, [el("h2", null, D.ct.name), rankList(D.ct.rows, D.ct.me)]) : el("div", "empty", "Откройте приложение кнопкой из группового чата, чтобы увидеть его рейтинг.");
    else if (ratingTab === "players") body = rankList(D.pt, D.u && D.u.me != null ? D.u.me : -1);
    else body = el("div", null, null, [el("div", "card", null, [el("span", "meta", "СЕЗОН"), el("span", "sub", "Баллы всех игроков чата идут в общую копилку.")]), rankList(D.ch, D.mych != null ? D.mych : -1)]);
    return [el("h1", null, "Рейтинги"), bar, body];
  }
  function loadMe() {
    if (MODE !== "live" || Date.now() - meAt < 30000) return;
    meAt = Date.now();
    api("me", { chat: chatParam }).then(function (d) { D = normalize(d); if (tab !== "game") render(); }).catch(function () { meAt = 0; });
  }

  // ---------- навигация ----------
  var views = { game: renderGame, games: renderGames, profile: renderProfile, ratings: renderRatings };
  function render() {
    document.body.classList.remove("is-night");
    var nodes = views[tab]().filter(Boolean);
    app.replaceChildren.apply(app, nodes);
  }
  function show(t) {
    tab = views[t] ? t : "game";
    document.querySelectorAll("nav button").forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (tab === "game") document.getElementById("gamedot").classList.remove("on");
    if (tab !== "game") loadMe();
    render();
    window.scrollTo(0, 0);
    poll();
  }
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () { haptic(); show(b.dataset.tab); });
  });
  setInterval(function () { var t = document.getElementById("timer"); if (t) t.textContent = timerText(); }, 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
  if (MODE === "live") loadMe(); else applyState(STATE);
  show(tab);
})();
</script>
</body>
</html>
