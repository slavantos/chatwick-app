<!doctype html>
<html lang="ru">
<head>

<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chatwick</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Шрифты лежат рядом с приложением — никаких запросов к сторонним сайтам */
  @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-cyrillic-400-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }

  @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-cyrillic-600-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Inter; font-weight: 700; font-display: swap; src: url(fonts/inter-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Inter; font-weight: 700; font-display: swap; src: url(fonts/inter-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Lora; font-weight: 500; font-display: swap; src: url(fonts/lora-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Lora; font-weight: 500; font-display: swap; src: url(fonts/lora-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Lora; font-weight: 700; font-display: swap; src: url(fonts/lora-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Lora; font-weight: 700; font-display: swap; src: url(fonts/lora-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  :root {
    --bg: #1E1B2E; --card: #2A263D; --card2: #332E49; --line: #3A3550; --ink: #F3EEE3;
    --muted: #B9B1A2; --accent: #E9A23B; --good: #7FD1A8; --bad: #E26D5C; --night: #0F1A33; --moon: #8EA8FF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  body { min-height: 100vh; transition: background .4s; }
  body.is-night { background: var(--night); }
  main { padding: 16px 16px 104px; max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 14px; font-family: Lora, serif; font-size: 26px; font-weight: 700; }
  h2 { margin: 20px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
  p { margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chip { padding: 6px 10px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .card.hero { background: var(--accent); color: var(--bg); }
  .card.hero .sub { color: #3a2a12; }
  .title { font-family: Lora, serif; font-size: 18px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .meta { font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent); color: var(--bg); white-space: nowrap; }
  .tag.soon { background: transparent; border: 1px solid var(--muted); color: var(--ink); }
  .tag.done { background: transparent; border: 1px solid var(--good); color: var(--good); }
  .story { flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; }
  .btn { min-height: 48px; border: none; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; width: 100%; cursor: pointer; padding: 0 14px; }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn.light { background: var(--ink); color: var(--bg); }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn:disabled { opacity: .45; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns.roomexit { flex-direction: column; margin-top: 18px; }
  .btns .btn { flex: 1; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .head h1 { margin: 0 0 2px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: #7C6BB0; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex-shrink: 0; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--card); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { padding: 6px 10px; border-radius: 999px; background: var(--card); font-size: 12px; font-weight: 600; }
  .badge.off { opacity: .45; }
  .card.ending { border-left: 3px solid var(--accent); }
  .card.ending.locked { border-left-color: var(--line); opacity: .7; }
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { min-height: 40px; border: none; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--bg); font-weight: 700; }
  .rank { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .rank .n { width: 26px; font-weight: 700; color: var(--muted); }
  .rank .n.top { color: var(--accent); }
  .rank .who { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .pts { font-size: 14px; color: var(--muted); }
  .rank.me { background: var(--accent); color: var(--bg); border-radius: 10px; border: none; margin: 4px 0; }
  .rank.me .n, .rank.me .pts { color: var(--bg); font-weight: 700; }
  .empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }

  /* --- игра --- */
  .gamehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .gamehead .where { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gamehead .story-name { font-family: Lora, serif; font-size: 17px; font-weight: 700; }
  .rescue { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .rescue .cells { display: flex; gap: 4px; }
  .rescue .cell { width: 22px; height: 8px; border-radius: 3px; background: var(--line); }
  .rescue .cell.on { background: var(--good); }
  .role { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; font-weight: 600; border: none; color: var(--ink); width: 100%; font-family: inherit; cursor: pointer; text-align: left; }
  .role.traitor { background: #4A1F25; }
  .role .hint { font-size: 12px; color: var(--muted); font-weight: 500; }
  .chapter { background: var(--card); border-radius: 18px; overflow: hidden; margin-bottom: 12px; }
  .chapter .cover { background: linear-gradient(135deg, #2F2946, #1E1B2E); padding: 18px 16px 14px; border-bottom: 3px solid var(--accent); }
  .chapter .label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent); text-transform: uppercase; }
  .chapter .ctitle { font-family: Lora, serif; font-size: 26px; font-weight: 700; margin-top: 4px; }
  .chapter .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .chapter .intro { font-family: Lora, serif; font-size: 16px; line-height: 1.55; font-weight: 500; }
  .chapter .event { font-size: 14px; color: var(--muted); font-style: italic; border-left: 3px solid var(--line); padding-left: 10px; line-height: 1.45; }
  .question { font-size: 17px; font-weight: 700; }
  .opt { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--card2); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; overflow: hidden; margin-bottom: 8px; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; background: rgba(233, 162, 59, .14); transition: width .3s; }
  .opt .num { position: relative; width: 28px; height: 28px; border-radius: 8px; background: var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .opt .lbl { position: relative; flex: 1; }
  .opt .cnt { position: relative; font-weight: 700; color: var(--muted); }
  .opt.mine { border-color: var(--accent); }
  .opt.mine .num { background: var(--accent); color: var(--bg); }
  .opt:disabled { cursor: default; }
  .status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin: 4px 2px 10px; }
  .timer { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.45; margin-bottom: 12px; background: var(--card); }
  .banner.warn { background: #4A3A1A; }
  .night { text-align: center; padding: 26px 16px; background: linear-gradient(180deg, #16244A, #0F1A33); border-radius: 18px; margin-bottom: 12px; }
  .night .moon { font-size: 44px; }
  .night .ttl { font-family: Lora, serif; font-size: 28px; font-weight: 700; color: #DCE4FF; margin-top: 6px; }
  .night .sub { color: #A9B6DD; margin-top: 6px; }
  .night .decided { margin-top: 14px; display: inline-block; background: rgba(142, 168, 255, .15); color: #DCE4FF; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .nbtn { display: block; width: 100%; min-height: 56px; border-radius: 14px; border: none; font: inherit; font-weight: 700; font-size: 15px; margin-bottom: 8px; cursor: pointer; color: #fff; }
  .nbtn.sab { background: #B4433A; }
  .nbtn.frame { background: #6B3FA0; }
  .nbtn.sleep { background: #2A3A66; }
  .nbtn small { display: block; font-weight: 500; font-size: 12px; opacity: .8; }
  .result { border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .result.ok { background: #1F3A2E; }
  .result.sab { background: #4A1F25; }
  .result .rt { font-family: Lora, serif; font-size: 22px; font-weight: 700; }
  .result .rtext { font-family: Lora, serif; font-size: 15px; line-height: 1.5; margin-top: 8px; }
  .clue { margin-top: 12px; background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.45; }
  .clue b { color: var(--accent); }
  .counts { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  .person { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--card); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; margin-bottom: 8px; }
  .person .pa { width: 36px; height: 36px; border-radius: 50%; background: #7C6BB0; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .person .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .cnt { font-weight: 700; color: var(--muted); }
  .person.mine { border-color: var(--bad); }
  .person:disabled { opacity: .5; cursor: default; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .final { border-radius: 18px; padding: 22px 16px; text-align: center; margin-bottom: 12px; }
  .final.caught { background: linear-gradient(180deg, #24523D, #1F3A2E); }
  .final.escaped { background: linear-gradient(180deg, #4A2630, #2E1B21); }
  .card.whocard.picked { border-color: #FFD27A; box-shadow: 0 0 0 1px #FFD27A inset; }
  button.card.whocard { width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; border: 1px solid var(--line); }
  button.card.whocard.picked { border-color: #FFD27A; box-shadow: 0 0 0 1px #FFD27A inset; background: rgba(255,210,122,.08); }
  .final.escape { background: linear-gradient(180deg, #1F4466, #18304A); }
  .final.stranded { background: linear-gradient(180deg, #5A2128, #3A1A20); }
  .final .big { font-size: 44px; }
  .final .ft { font-family: Lora, serif; font-size: 28px; font-weight: 700; margin-top: 6px; }
  .final .ftext { font-family: Lora, serif; font-size: 15px; line-height: 1.5; margin-top: 10px; opacity: .9; }
  .hist { font-size: 13px; line-height: 1.5; color: var(--muted); }
  .hist b { color: var(--ink); }
  .controls { display: flex; gap: 8px; margin-top: 6px; }
  .controls .btn { flex: 1; min-height: 44px; font-size: 14px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 96px; max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: none; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 4px calc(12px + env(safe-area-inset-bottom)); z-index: 10; }
  body.is-night nav { background: var(--night); }
  nav button { position: relative; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
  nav button[aria-current="page"] { color: var(--accent); }
  nav svg { width: 22px; height: 22px; }
  nav .dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: none; }
  nav .dot.on { display: block; }

  /* --- одиночные истории --- */
  .wallet { display: flex; gap: 6px; }
  .wchip { padding: 6px 10px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .wchip.dark { background: rgba(0,0,0,.45); color: #fff; backdrop-filter: blur(6px); }
  .daily { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 52px; padding: 0 16px; margin-bottom: 12px; border: 1px dashed var(--accent); border-radius: 14px; background: rgba(233,162,59,.08); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .daily b { color: #FF8FB4; }
  .scard { background: var(--card); border-radius: 20px; overflow: hidden; margin-bottom: 14px; }
  /* кинокарточка истории */
  .poster { position: relative; border-radius: 22px; overflow: hidden; margin-bottom: 16px; background: #0b0a12; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .poster .reel { position: relative; height: 430px; overflow: hidden; }
  .poster .shot { position: absolute; inset: -6%; opacity: 0; transition: opacity 1.4s ease; background-size: cover; background-position: center; }
  .poster .shot svg { width: 100%; height: 100%; display: block; }
  .poster .shot.photo svg { display: none; }
  .poster .shot.on { opacity: 1; animation: kenburns 9s ease-out forwards; }
  .poster .shot:nth-child(even).on { animation-name: kenburns2; }
  @keyframes kenburns { from { transform: scale(1.12) translate(2%, 1%); } to { transform: scale(1) translate(0, 0); } }
  @keyframes kenburns2 { from { transform: scale(1) translate(-2%, 0); } to { transform: scale(1.12) translate(1%, -1%); } }
  .poster .hero-sprite { position: absolute; right: -6%; bottom: 0; height: 88%; pointer-events: none; filter: drop-shadow(0 0 24px rgba(0,0,0,.6)); animation: rise .9s ease both; }
  .poster .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,10,18,.15) 0%, rgba(11,10,18,0) 30%, rgba(11,10,18,.75) 62%, #0b0a12 96%); }
  .poster .ptop { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .poster .ptag { padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .3px; }
  .poster .ptag.new { background: var(--accent); color: #1E1B2E; }
  .poster .pinfo { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 16px; display: flex; flex-direction: column; gap: 8px; }
  .poster .ptitle { font-family: Lora, serif; font-size: 32px; line-height: 1.05; font-weight: 700; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .poster .pline { font-family: Lora, serif; font-style: italic; color: #F3D9A8; font-size: 15px; }
  .poster .pmeta { color: rgba(255,255,255,.7); font-size: 12px; font-weight: 600; }
  .poster .pteaser { color: rgba(255,255,255,.82); font-size: 14px; line-height: 1.5; }
  .poster .pbody { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
  .castrow { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .castrow::-webkit-scrollbar { display: none; }
  .castm { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; flex: none; text-align: center; }
  .castm .ava { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-family: Lora, serif; font-weight: 700; font-size: 22px; color: #1E1B2E; border: 2px solid rgba(255,255,255,.15); background-size: 180%; background-position: 50% 8%; }
  .castm b { color: #fff; font-size: 12px; }
  .castm span { color: rgba(255,255,255,.5); font-size: 10px; line-height: 1.2; }
  .pprog { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.75); font-size: 12px; font-weight: 600; }
  .pprog .bar { flex: 1; }
  /* читалка: персонажи, погода, звук, прогресс */
  .fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .flash { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: #dfe9ff; opacity: 0; }
  .cast { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .sprite { position: absolute; bottom: 0; left: 50%; height: min(74vh, 760px); max-width: 120vw; opacity: 0; transform: translateX(-30%) translateY(24px); transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1), filter .45s ease; filter: drop-shadow(0 0 30px rgba(0,0,0,.55)); }
  .sprite.on { opacity: 1; transform: translateX(-42%) translateY(0); }
  .sprite.left.on { transform: translateX(-62%) translateY(0); }
  .sprite.dim { filter: brightness(.55) drop-shadow(0 0 30px rgba(0,0,0,.55)); }
  .sprite.breath { animation: breath 5s ease-in-out infinite; }

    if (!g.me.in) nodes.push(button("btn primary", "✋ Я в игре", function () { roomApi("join", { code: g.room.code }); }));
    if (g.host) {
      nodes.push(el("div", "btns", null, [button("btn light", "▶️ Начать", function () { whoApi("start"); }, g.players.length < g.min_players),
                                          button("btn danger", "Закрыть", function () { whoApi("cancel"); })]));
      nodes.push(el("div", "note", g.players.length < g.min_players ? "Нужно минимум " + g.min_players + " игрока" : "Можно начинать"));
    } else nodes.push(el("div", "note", "Игру начнёт ведущий"));
    return nodes;
  }
  function partyRanking(g) {
    if (!g.ranking || !g.ranking.length) return [];
    return [el("h2", null, "Счёт"), el("div", null, null, g.ranking.map(function (r, i) {
      return el("div", r[2] ? "rank me" : "rank", null, [el("span", i < 3 ? "n top" : "n", ["🥇", "🥈", "🥉"][i] || String(i + 1)), el("span", "who", r[0]), el("span", "pts", String(r[1]))]);
    }))];
  }
  function partyFinal(g, big, title, text) {
    return el("div", "final caught", null, [el("div", "big", big), el("div", "ft", title), el("p", "ftext", text || "")]);
  }
  function oneLineInput(ph, max, val, onInput) {
    var inp = el("input", "pinput");
    inp.placeholder = ph; inp.maxLength = max; inp.value = val || "";
    inp.addEventListener("input", function () { onInput(inp.value); });
    return inp;
  }

  function matchView(g) {
    var nodes = [partyHead(g)];
    if (g.phase === "write") {
      nodes.push(el("div", "chapter", null, [el("div", "cover", null, [el("div", "label", "Вопрос раунда"), el("div", "ctitle", g.prompt)])]));
      nodes.push(el("div", "sub", "Напишите то, что, по-вашему, напишут остальные. Одно-два слова."));
      if (g.pair && g.round > 1) nodes.push(el("div", "banner", "🔮 На одной волне: " + g.sync + " из " + (g.round - 1)));
      if (!g.me.in) nodes.push(el("div", "banner", "Вы наблюдаете — отвечают участники игры."));
      else {
        var inp = oneLineInput("Ваш ответ", 40, PS.draft || g.me.answer, function (v) { PS.draft = v; });
        var send = function () {
          if (!inp.value.trim()) { toast("Напишите слово 🙂"); return; }
          PS.draft = inp.value; whoApi("answer", { text: inp.value });
        };
        inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") send(); });
        nodes.push(inp);
        if (g.me.answer) nodes.push(el("div", "meta", "✓ Ответ принят: «" + g.me.answer + "» — можно поменять"));
        nodes.push(button("btn primary", g.me.answer ? "Поменять ответ" : "Отправить", send));
      }
      nodes.push(whoTimer(g, "Ответили", g.done));
      nodes.push(whoControls(g));
      return nodes;
    }
    var L = g.last || {};
    if (g.phase === "finished") {
      nodes.push(g.pair ? partyFinal(g, "🔮", g.sync + " из " + g.rounds, g.verdict) : partyFinal(g, "🏆", g.ranking[0] ? g.ranking[0][0] : "Финал", g.verdict));
    }
    nodes.push(el("div", "banner", (g.phase === "finished" ? "Последний вопрос: " : "📊 ") + (L.prompt || g.prompt)));
    if (L.everyone) nodes.push(el("div", "banner", "✨ Все совпали — бонус каждому!"));
    (L.groups || []).forEach(function (gr) {
      nodes.push(el("div", "card pgroup" + (gr.n > 1 ? " hit" : ""), null, [
        el("div", "row", null, [el("span", "gt", "«" + gr.text + "»"), gr.n > 1 ? el("span", "tag", "× " + gr.n) : null]),
        el("div", "gnames", gr.names.join(", "))]));
    });
    if (L.silent && L.silent.length) nodes.push(el("div", "note", "Не ответили: " + L.silent.join(", ")));
    if (!g.pair) nodes = nodes.concat(partyRanking(g));
    if (g.phase === "reveal") { nodes.push(whoTimer(g, "Следующий вопрос скоро")); nodes.push(whoControls(g)); }
    return nodes;
  }

  function truthView(g) {
    var nodes = [partyHead(g)];
    if (g.phase === "write") {
      nodes.push(el("div", "chapter", null, [el("div", "cover", null, [el("div", "label", "Тема раунда"), el("div", "ctitle", "Три факта " + g.theme)])]));
      if (!g.me.in) nodes.push(el("div", "banner", "Вы наблюдаете — пишут участники игры."));
      else {
        if (g.me.facts && !PS.facts.join("")) { PS.facts = g.me.facts.slice(); PS.lie = g.me.lie; }
        nodes.push(el("div", "sub", "Два факта — правда, один — выдумка. Нажмите 🤥 у выдуманного. Чем правдоподобнее ложь и неожиданнее правда, тем лучше."));
        [0, 1, 2].forEach(function (i) {
          var inp = oneLineInput("Факт " + (i + 1), 90, PS.facts[i], function (v) { PS.facts[i] = v; });
          nodes.push(el("div", "factrow", null, [inp, button("btn ghost liebtn" + (PS.lie === i ? " on" : ""), "🤥", function () { PS.lie = i; haptic(); render(); })]));
        });
        nodes.push(el("div", "meta", PS.lie == null ? "Отметьте выдумку кнопкой 🤥" : "Выдумка: факт " + (PS.lie + 1)));
        if (g.me.facts) nodes.push(el("div", "meta", "✓ Факты приняты — можно поправить"));
        nodes.push(button("btn primary", g.me.facts ? "Обновить" : "Отправить", function () {
          if (PS.facts.some(function (f) { return !f.trim(); })) { toast("Нужно три факта"); return; }
          if (PS.lie == null) { toast("Отметьте, какой факт выдуман 🤥"); return; }
          whoApi("facts", { facts: PS.facts, lie: PS.lie });
        }));
      }
      nodes.push(whoTimer(g, "Готовы", g.done));
      nodes.push(whoControls(g));
      return nodes;
    }
    if (g.phase === "guess") {
      nodes.push(el("div", "banner", "🔎 Где выдумка? Выберите по одному факту у каждого."));
      if (!Object.keys(PS.picks).length && g.me.picks) PS.picks = Object.assign({}, g.me.picks);
      (g.cards || []).forEach(function (c) {
        var card = el("div", "card" + (c.mine ? " whocard mine" : ""));
        card.appendChild(el("b", null, c.mine ? c.name + " (вы)" : c.name));
        c.facts.forEach(function (f, i) {
          var b = el("button", "factpick" + (!c.mine && PS.picks[c.author] === i ? " on" : ""), (!c.mine && PS.picks[c.author] === i ? "🤥 " : "") + f);
          b.type = "button";
          if (c.mine || !g.me.in) b.disabled = true;
          else b.addEventListener("click", function () { PS.picks[c.author] = i; haptic(); render(); });
          card.appendChild(b);
        });
        nodes.push(card);
      });
      if (g.me.in) nodes.push(button("btn primary", g.me.sent ? "Обновить догадки" : "Готово", function () { whoApi("guess", { picks: PS.picks }); }));
      nodes.push(whoTimer(g, "Готовы", g.done));
      nodes.push(whoControls(g));
      return nodes;
    }
    var L = g.last || {};
    if (g.phase === "finished") nodes.push(partyFinal(g, "🕵️", g.ranking[0] ? g.ranking[0][0] : "Финал", "лучший детектор лжи"));
    else nodes.push(el("div", "banner", "📊 Выдумки раскрыты · " + (L.theme || "")));
    (L.rows || []).forEach(function (r) {
      var card = el("div", "card");
      card.appendChild(el("b", null, r.name));
      r.facts.forEach(function (f, i) {
        card.appendChild(el("div", "factpick " + (i === r.lie ? "lie" : "truth"), (i === r.lie ? "🤥 " : "✓ ") + f));
      });
      card.appendChild(el("div", "meta", (r.right.length ? "Раскусили: " + r.right.join(", ") : "Никто не раскусил") + (r.fooled ? " · обманут(ы): " + r.fooled : "")));
      nodes.push(card);
    });
    nodes = nodes.concat(partyRanking(g));
    if (g.phase === "reveal") { nodes.push(whoTimer(g, "Следующий раунд скоро")); nodes.push(whoControls(g)); }
    return nodes;
  }

  function spyView(g) {
    var nodes = [partyHead(g)], me = g.me || {};
    var optChips = function (pickable) {
      return el("div", "optchips", null, (g.options || []).map(function (o) {
        if (!pickable) return el("span", "badge", o);
        return button("pick" + (PS.place === o ? " on" : ""), o, function () { PS.place = o; haptic(); render(); });
      }));
    };
    if (g.phase === "clue" || g.phase === "vote") {
      nodes.push(me.spy ? el("div", "card spyrole", null, [el("div", "big", "🕶"), el("div", "pl", "Вы — лишний"), el("div", "sub", "Место вам неизвестно. Слушайте подсказки и не выдайте себя.")])
        : me.in ? el("div", "card spyrole", null, [el("div", "meta", "МЕСТО ДЕЙСТВИЯ"), el("div", "pl", g.place), el("div", "sub", "Один из вас этого не знает.")])
        : el("div", "banner", "Вы наблюдаете за игрой."));
    }
    if (g.phase === "clue") {
      if (me.in) {
        nodes.push(el("div", "sub", me.spy ? "Напишите подсказку — такую, чтобы подошла к любому месту из списка." : "Напишите подсказку: понятную своим, но не лишнему. Само место называть нельзя."));
        var inp = oneLineInput("Подсказка — слово или фраза", 40, PS.draft || me.clue, function (v) { PS.draft = v; });
        nodes.push(inp);
        if (me.clue) nodes.push(el("div", "meta", "✓ Подсказка принята: «" + me.clue + "»"));
        nodes.push(button("btn primary", me.clue ? "Поменять" : "Отправить", function () {
          if (!inp.value.trim()) { toast("Напишите подсказку"); return; }
          PS.draft = inp.value; whoApi("clue", { text: inp.value });
        }));
      }
      nodes.push(el("div", "ghead", "Возможные места"));
      nodes.push(optChips(false));
      nodes.push(whoTimer(g, "Подсказки", g.done));
      nodes.push(whoControls(g));
      return nodes;
    }
    if (g.phase === "vote") {
      if (PS.target == null && me.vote != null) PS.target = me.vote;
      if (!PS.place && me.guess) PS.place = me.guess;
      nodes.push(el("div", "banner", "🗳 Чья подсказка выдаёт лишнего? Нажмите на игрока."));
      (g.clues || []).forEach(function (c) {
        var mine = c.id === me.id;
        var card = el("button", "card whocard" + (mine ? " mine" : "") + (PS.target === c.id ? " picked" : ""));
        card.type = "button";
        card.appendChild(el("div", "row", null, [el("p", "whotext", "«" + c.text + "»"), el("span", PS.target === c.id ? "tag" : "meta", PS.target === c.id ? "🎯 " + c.name : c.name)]));
        if (!mine && me.in) card.addEventListener("click", function () { PS.target = c.id; haptic(); render(); });
        nodes.push(card);
      });
      var silent = g.players.filter(function (p) { return !(g.clues || []).some(function (c) { return c.id === p.id; }); });
      silent.forEach(function (p) {
        if (p.id === me.id || !me.in) return;
        nodes.push(button("pick" + (PS.target === p.id ? " on" : ""), p.name + " — без подсказки", function () { PS.target = p.id; render(); }));
      });
      if (me.spy) { nodes.push(el("div", "ghead", "Угадайте место (+2)")); nodes.push(optChips(true)); }
      if (me.in) nodes.push(button("btn primary", me.vote != null ? "Изменить голос" : "Голосовать", function () {
        if (PS.target == null) { toast("Выберите игрока"); return; }
        whoApi("vote", { target: PS.target, place: PS.place });
      }));
      nodes.push(whoTimer(g, "Проголосовали", g.done));
      nodes.push(whoControls(g));
      return nodes;
    }
    var L = g.last || {};
    if (g.phase === "finished") nodes.push(partyFinal(g, "🏆", g.ranking[0] ? g.ranking[0][0] : "Финал", "побеждает с " + (g.ranking[0] ? g.ranking[0][1] : 0) + " очками"));
    nodes.push(el("div", "final " + (L.caught ? "caught" : "escaped"), null, [
      el("div", "big", L.caught ? "🎯" : "🕶"),
      el("div", "ft", L.caught ? "Лишний пойман: " + L.spy : L.spy + " ускользнул(а)"),
      el("p", "ftext", "Место: " + L.place + (L.guess ? " · лишний назвал: " + L.guess + (L.guessed ? " ✓" : " ✗") : ""))]));
    (L.clues || []).forEach(function (c) {
      nodes.push(el("div", "card whocard", null, [el("div", "row", null, [el("p", "whotext", "«" + c[1] + "»"), el("span", c[2] ? "tag" : "meta", (c[2] ? "🕶 " : "") + c[0])])]));
    });
    if (L.votes && L.votes.length) nodes.push(el("div", "note", "Голоса: " + L.votes.map(function (v) { return v[0] + " — " + v[1]; }).join(", ")));
    nodes = nodes.concat(partyRanking(g));
    if (g.phase === "reveal") { nodes.push(whoTimer(g, "Следующий раунд скоро")); nodes.push(whoControls(g)); }
    return nodes;
  }
  function partyView(g) {
    psync(g);
    if (g.phase === "lobby") return partyLobby(g);
    return ({ match: matchView, truth: truthView, spy: spyView }[g.kind])(g);
  }

  // ---------- всплывашки: приглашения и «тебя ждут» ----------
  var seenNotices = {};
  function showNotices(list) {
    (list || []).forEach(function (n) {
      if (seenNotices[n.id]) return;
      seenNotices[n.id] = 1;
      if (n.kind === "hurry") {
        haptic("err");
        if (tab === "game" && STATE.game && STATE.game.chat === n.chat) { toast(n.text); return; }
      } else haptic("ok");
      var old = document.getElementById("noticesheet"); if (old) old.remove();
      var sheet = el("div", "sheet"); sheet.id = "noticesheet";
      var close = function () { sheet.remove(); syncBack(); };
      var go = n.kind === "invite"
        ? button("btn primary", "🎮 Войти в комнату", function () { close(); roomApi("join", { code: n.code }).then(function () { show("game"); }); })
        : button("btn primary", "🎮 Открыть игру", function () { close(); chatParam = String(n.chat); show("game"); });
      sheet.appendChild(el("div", "panel", null, [
        el("div", "row", null, [el("div", "stitle", n.kind === "invite" ? "🎲 Приглашение" : "🔔 Тебя ждут"), button("rclose light", "✕", close)]),
        el("p", "sub", n.text + (n.code ? " · комната " + n.code : "")), go,
        button("btn ghost", "Позже", close)]));
      sheet.addEventListener("click", function (ev) { if (ev.target === sheet) close(); });
      document.body.appendChild(sheet); syncBack();
    });
  }

  // ---------- навигация ----------
  var views = { stories: renderStories, game: renderGame, profile: renderProfile, ratings: renderRatings };
  function profDot() {
    var d = document.getElementById("profdot");
    if (d) d.classList.toggle("on", !!(D.solo && D.solo.ach_ready));
  }
  function render() {
    profDot();
    document.body.classList.remove("is-night");
    document.body.classList.toggle("has-fab", !!(tab === "game" && STATE.game && STATE.game.room));
    var nodes = views[tab]().filter(Boolean);
    app.replaceChildren.apply(app, nodes);
  }
  function show(t) {
    tab = views[t] ? t : "stories";
    if (tab === "stories") loadSolo();
    document.querySelectorAll("nav button").forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (tab === "game") document.getElementById("gamedot").classList.remove("on");
    if (tab === "profile" || tab === "ratings") loadMe();
    render();
    window.scrollTo(0, 0);
    poll();
  }
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () { haptic(); show(b.dataset.tab); });
  });
  setInterval(function () { var t = document.getElementById("timer"); if (t) t.textContent = timerText(); }, 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
  if (MODE === "live") loadMe(); else applyState(STATE);
  if (MODE === "demo" && hashParams.chat === "open") { tab = "game"; chatUI.open = true; }
  if (MODE === "demo" && hashParams.shop) { setWallet(DEMO_SOLO.wallet); openShop(hashParams.shop); }
  if (MODE === "demo") window.__cw = { AUD: AUD, FX: FX, setScene: setScene, closeReader: closeReader, applyStyle: applyStyle };  // для проверок в браузере
  // открыть форму сразу из команды бота: #tab=profile&open=feedback | support
  if (hashParams.open === "feedback") setTimeout(function () { openFeedback({}); }, 400);
  if (hashParams.open === "support") setTimeout(function () { openSupport(); }, 400);
  // демо-экраны для предпросмотра в браузере: #solo=read | setup | end
  if (MODE === "demo" && hashParams.solo) {
    setWallet(DEMO_SOLO.wallet);
    SOLO.story = "lighthouse";
    reader.classList.add("on"); document.body.classList.add("reading");
    if (hashParams.solo === "setup") drawSetup();
    else if (hashParams.solo === "end") {
      var endView = JSON.parse(JSON.stringify(DEMO_VIEW));
      endView.status = "chapter_done";
      endView.node = { id: "n12", bg: "night_sea", has_next: false, choices: [], lines: [{ who: "Лина", color: "#E9A23B", text: "Аня... Марка нет у костра." }] };
      endView.summary = [{ text: "Возразить: «На картах здесь только рифы»", share: 38 }, { text: "Броситься к Лине", share: 71 }, { text: "Остаться с Линой у обломков", share: 54 }];
      endView.bonds = [{ id: "lina", name: "Лина", color: "#E9A23B", portrait: "lina", hearts: 4 }, { id: "mark", name: "Марк", color: "#7FB3E0", portrait: "mark", hearts: 2 }];
      endView.wallet = { candles: 0, max: 3, feathers: 22, next_candle: 7380, daily: false, daily_amount: 2 };
      setWallet(endView.wallet);
      SOLO.view = endView; setScene("night_sea"); drawChapterEnd();
    } else {
      if (hashParams.bg) DEMO_VIEW.node.bg = hashParams.bg;
      if (hashParams.pz) {
        var PZD = {
          code: { bg: "stairs", t: "Затёрты кнопки 0, 2 и 4. Код из четырёх цифр — как время на часах.", p: { type: "code", title: "Кодовый замок", len: 4, keys: "024", left: 3, tries: 4, skip: 10, giveup: "Не рисковать и уйти" } },
          tune: { bg: "radio_room", t: "Крути ручку, пока шум не стихнет. Аварийная — между 155 и 158.", p: { type: "tune", title: "Аварийная частота", min: 150, max: 162, step: .1, target: 156.8, left: 3, tries: 3, skip: 8, giveup: "Убрать руку от рации" } },
          morse: { bg: "lamp_room", t: "Короткое нажатие — точка, долгое — тире. S = · · ·   O = — — —", p: { type: "morse", title: "Сигнал SOS", word: "SOS", len: 9, left: 3, tries: 3, skip: 0, giveup: "Просто держать свет" } }
        }[hashParams.pz];
        PZD.p.hint = PZD.t;
        DEMO_VIEW.node = { id: "pz", bg: PZD.bg, has_next: false, choices: [], lines: [{ who: "", text: "Перед тобой загадка." }], puzzle: PZD.p };
      }
      if (hashParams.timer) DEMO_VIEW.node.timer = { sec: 12, default: 1 };
      showView(DEMO_VIEW);
      if (hashParams.line) { SOLO.line = Math.min(+hashParams.line || 1, DEMO_VIEW.node.lines.length - 1); drawLine(); }
      if (hashParams.rel) showRel([{ name: "Лина", color: "#E9A23B", d: 1, portrait: "lina" }, { name: "Марк", color: "#7FB3E0", d: -1, portrait: "" }]);
      setTimeout(finishTyping, 50);
    }
  }
  show(tab);
})();
</script>
</body>
